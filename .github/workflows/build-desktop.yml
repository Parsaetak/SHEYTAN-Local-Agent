name: Build Desktop

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: sheytan-desktop-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

# v1.1.8: the release identity is NOT hardcoded here anymore. package.json
# is the single source of truth; the audit job resolves it at runtime
# (scripts/release-version.mjs --env) and every other job consumes it via
# needs-outputs. A version bump therefore only touches package.json + the
# derived surfaces the script repairs — a stale env constant can never
# desync CI again (root cause of run 34788709977).
env:
  GO_VERSION: "1.26"
  NODE_VERSION: "24"
  # v1.2.1: canonical package-root variables — ONE root per platform, from
  # which every staging directory, ZIP name, ZIP entry check, artifact name
  # and release-metadata reference is derived. The root cause of run
  # 34871838054 was duplicated root literals: the Linux ZIP was created
  # under SHEYTAN-Local-Agent/ while its verifier expected SHEYTAN-LA/
  # entries. No root literal is repeated below anymore; the Go contract
  # (internal/releasecontract) mirrors these values and the stress gate
  # fails the build if the two copies of the truth ever drift apart again.
  WIN_PKG_ROOT: "SHEYTAN-LA"
  LINUX_PKG_ROOT: "SHEYTAN-Local-Agent"

jobs:
  audit:
    name: Source & frontend audit
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    # v1.1.9: the identity step emits APP_VERSION / APP_VERSION_FULL /
    # APP_CODENAME (exactly as release-version.mjs --env names them). Run
    # 34791882219 failed because these mappings pointed at lowercase names
    # (steps.identity.outputs.version) that the step never writes, so every
    # needs.audit.outputs.* resolved to an empty string and the Linux/Windows
    # release-metadata verification failed on empty APP_VERSION. The output
    # names here MUST match the keys written to GITHUB_OUTPUT below.
    outputs:
      version: ${{ steps.identity.outputs.APP_VERSION }}
      version_full: ${{ steps.identity.outputs.APP_VERSION_FULL }}
      codename: ${{ steps.identity.outputs.APP_CODENAME }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          package-manager-cache: true

      - name: Verify repository shape and release identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail

          test -f package.json
          test -f package-lock.json
          test -f go.mod
          test -f go.sum
          test -f internal/config/config.go
          test -f src/App.tsx
          test -f src/AgentBody.tsx
          test -f src/styles.css
          test ! -e web/package.json

          node --version
          npm --version

          node_major="$(node -p 'process.versions.node.split(".")[0]')"
          test "$node_major" -ge 24

          node scripts/release-version.mjs

          # v1.1.8: derive the release identity from package.json (the one
          # canonical source) instead of trusting a workflow env constant.
          identity_out="$(node scripts/release-version.mjs --env)"

          while IFS='=' read -r key value; do
            case "$key" in
              APP_VERSION | APP_VERSION_FULL | APP_CODENAME)
                export "$key=$value"
                printf '%s=%s\n' "$key" "$value" >> "$GITHUB_OUTPUT"
                ;;
            esac
          done <<< "$identity_out"

          # v1.1.9: fail fast here — before any expensive build job starts —
          # if the release identity did not resolve. An empty value used to
          # surface only later as a cryptic metadata-verification failure in
          # Linux/Windows (root cause of run 34791882219).
          if [ -z "${APP_VERSION:-}" ] || [ -z "${APP_VERSION_FULL:-}" ] || [ -z "${APP_CODENAME:-}" ]; then
            echo "::error::Release identity did not resolve. APP_VERSION, APP_VERSION_FULL and APP_CODENAME must all be non-empty after 'release-version.mjs --env'."
            exit 1
          fi

          # The identity step must be tagged so needs-outputs can read it
          # (id: identity above). Job outputs map from the APP_* names.
          echo "Resolved identity: $APP_VERSION / $APP_VERSION_FULL / $APP_CODENAME"

          # Belt and suspenders: the repaired tree must pass check mode.
          node scripts/release-version.mjs --check

          grep -F "AppVersion  = \"$APP_VERSION\"" internal/config/config.go
          grep -F "\"version\": \"$APP_VERSION_FULL\"" package.json
          grep -F "productVersion: \"$APP_VERSION_FULL\"" build/config.yml
          grep -F "SHEYTAN-Local-Agent v$APP_VERSION" SIGNATURE

      - name: Install frontend dependencies
        shell: bash
        run: npm ci

      - name: Frontend verification
        shell: bash
        run: |
          set -euo pipefail

          npm run typecheck
          npm run lint
          npm run build

      - name: Verify embedded frontend
        shell: bash
        run: |
          set -euo pipefail

          test -f web/static/index.html
          grep -q '<div id="root"></div>' web/static/index.html

          echo "Embedded frontend verification passed."

      # v1.1.5Z Phase 1: the C++ native engine skeleton builds and its
      # dependency-free test suites pass on the same runner the Go build
      # uses. Ubuntu-24.04 images ship cmake (>= 3.28) and g++.
      # v1.2.1: the engine build is cached on the full source hash of
      # native/engine/** — a cache hit reuses the previous build tree
      # (cmake reconfigures if anything is stale), so repeated CI runs pay
      # the compile cost once per source revision. Reproducibility is
      # unaffected: the key is the exact source hash, and ctest still runs.
      - name: Cache native engine build
        uses: actions/cache@v5
        with:
          path: native/engine/build
          key: native-engine-${{ runner.os }}-${{ hashFiles('native/engine/**') }}

      - name: Native engine (C++) build and tests
        shell: bash
        run: |
          set -euo pipefail

          cmake --version
          cmake -S native/engine -B native/engine/build
          cmake --build native/engine/build
          ctest --test-dir native/engine/build --output-on-failure

          test -x native/engine/build/shtn-engine-host
          echo "Native engine verification passed."

  build-windows:
    name: Windows x64
    needs: audit
    timeout-minutes: 60

    # v1.1.8: identity flows from the audit job's runtime resolution of
    # package.json — no local hardcoded version can drift here either.
    env:
      APP_VERSION: ${{ needs.audit.outputs.version }}
      APP_VERSION_FULL: ${{ needs.audit.outputs.version_full }}
      APP_CODENAME: ${{ needs.audit.outputs.codename }}
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          package-manager-cache: true

      - name: Verify Node and repository
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          node --version
          npm --version

          $nodeMajor = [int](node --version).TrimStart("v").Split(".")[0]

          if ($nodeMajor -lt 24) {
            throw "Node.js 24 or newer is required."
          }

          if (-not (Test-Path "package.json")) {
            throw "Root package.json missing."
          }

          if (-not (Test-Path "package-lock.json")) {
            throw "Root package-lock.json missing."
          }

          if (-not (Test-Path "go.mod")) {
            throw "go.mod missing."
          }

          if (-not (Test-Path "go.sum")) {
            throw "go.sum missing."
          }

          if (Test-Path "web/package.json") {
            throw "Unexpected web/package.json found."
          }

      - name: Synchronize Zeta release metadata
        shell: pwsh
        run: node scripts/release-version.mjs

      - name: Verify release metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # v1.1.4Z CI repair: the original step reused Bash-style
          # backslash-quote escaping inside PowerShell strings. PowerShell
          # terminates the string at the quote after the backslash, splits
          # the -Pattern argument into extra positional tokens and fails
          # with "A positional parameter cannot be found that accepts
          # argument". Single-quoted literals plus explicit concatenation
          # need no escaping, and the -Quiet boolean makes a missing match
          # FAIL the step (a bare Select-String pipeline exits 0 when
          # nothing matches, which would silently weaken this gate).
          $checks = @(
            @{
              Label   = "internal/config/config.go AppVersion"
              Path    = "internal/config/config.go"
              Pattern = 'AppVersion  = "' + $env:APP_VERSION + '"'
            },
            @{
              Label   = "package.json version"
              Path    = "package.json"
              Pattern = '"version": "' + $env:APP_VERSION_FULL + '"'
            },
            @{
              Label   = "build/config.yml productVersion"
              Path    = "build/config.yml"
              Pattern = 'productVersion: "' + $env:APP_VERSION_FULL + '"'
            },
            @{
              Label   = "SIGNATURE first line"
              Path    = "SIGNATURE"
              Pattern = 'SHEYTAN-Local-Agent v' + $env:APP_VERSION
            }
          )

          foreach ($check in $checks) {
            $found = Select-String -Path $check.Path -Pattern $check.Pattern -SimpleMatch -Quiet

            if (-not $found) {
              throw "Release metadata mismatch in $($check.Label): expected $($check.Pattern)"
            }

            Write-Host "Verified $($check.Label): $($check.Pattern)"
          }

      - name: Install frontend dependencies
        shell: pwsh
        run: npm ci

      - name: Frontend verification
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          npm run typecheck
          npm run lint
          npm run build

      - name: Verify embedded frontend
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (-not (Test-Path "web/static/index.html")) {
            throw "web/static/index.html was not generated."
          }

          $html = Get-Content "web/static/index.html" -Raw

          if ($html -notmatch '<div id="root"></div>') {
            throw "Embedded frontend root element was not found."
          }

          Write-Host "Embedded frontend verification passed."

      - name: Setup Go 1.26
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Go verification
        shell: pwsh
        env:
          CGO_ENABLED: "0"
        run: |
          $ErrorActionPreference = "Stop"

          go version

          go test ./internal/... -tags headless -count=1
          go test ./... -run Test -count=1
          go vet ./...

      - name: Generate Windows resources
        shell: pwsh
        env:
          CGO_ENABLED: "0"
        run: |
          $ErrorActionPreference = "Stop"

          go run ./scripts/gen-syso

          if (-not (Test-Path "rsrc_windows_amd64.syso")) {
            throw "Windows resource object was not generated."
          }

      - name: Build Windows executable and console smoke probe
        shell: pwsh
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
        run: |
          $ErrorActionPreference = "Stop"

          # v1.2.1: staging root derives from the canonical WIN_PKG_ROOT.
          $appRoot = "dist/windows/app/${env:WIN_PKG_ROOT}"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $appRoot | Out-Null

          go build `
            -trimpath `
            -ldflags="-s -w -H=windowsgui" `
            -o "$appRoot/SHEYTAN-LA.exe" `
            .

          go build `
            -trimpath `
            -ldflags="-s -w" `
            -o "dist/windows/sheytan-version-smoke.exe" `
            .

      - name: Verify Windows executable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # v1.2.1: the probed executable derives from the canonical root.
          $exe = "dist/windows/app/${env:WIN_PKG_ROOT}/SHEYTAN-LA.exe"
          $probe = "dist/windows/sheytan-version-smoke.exe"

          if (-not (Test-Path $exe)) {
            throw "Windows executable was not produced."
          }

          if (-not (Test-Path $probe)) {
            throw "Windows console smoke probe was not produced."
          }

          $size = (Get-Item $exe).Length

          if ($size -lt 1000000) {
            throw "Windows executable is suspiciously small: $size bytes."
          }

          Write-Host "Windows executable size: $size bytes"

          $output = & $probe version 2>&1
          $exitCode = $LASTEXITCODE
          $text = ($output | Out-String).Trim()

          Write-Host "=== Windows console smoke probe ==="
          Write-Host $text
          Write-Host "=== Console probe exit code: $exitCode ==="

          if ($exitCode -ne 0) {
            throw "Windows console version probe exited with code $exitCode."
          }

          $expectedVersion = "SHEYTAN-Local-Agent v$($env:APP_VERSION)"

          if ($text -notmatch [regex]::Escape($expectedVersion)) {
            throw "Windows executable version mismatch. Expected: $expectedVersion"
          }

          if ($text -notmatch "os:\s+windows/amd64") {
            throw "Windows executable platform mismatch. Expected windows/amd64."
          }

          Write-Host "Windows executable version/platform smoke test passed."

          Remove-Item $probe -Force

      - name: Prepare Windows portable package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # v1.2.1: canonical package root — same value controls staging,
          # ZIP creation, ZIP verification and artifact naming.
          $root = "dist/windows/app/${env:WIN_PKG_ROOT}"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "$root/models" | Out-Null

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "$root/workspace" | Out-Null

          @"
          SHEYTAN-LA $env:APP_VERSION ($env:APP_CODENAME)

          Portable Windows x64 distribution.

          Keep the complete SHEYTAN-LA folder together.
          "@ | Set-Content "$root/README.txt" -Encoding utf8

          @"
          LOCAL MODELS

          Place GGUF models in this folder.
          "@ | Set-Content "$root/models/README.txt" -Encoding utf8

          @"
          CODING LAB

          Portable Coding Lab workspaces live under this folder.
          "@ | Set-Content "$root/workspace/README.txt" -Encoding utf8

          @"
          SHEYTAN-LA (SHEYTAN Local Agent)
          Version: $env:APP_VERSION
          Codename: $env:APP_CODENAME
          Platform: Windows x64
          Commit: $env:GITHUB_SHA
          "@ | Set-Content "$root/BUILD-INFO.txt" -Encoding utf8

          if (Test-Path "LICENSE") {
            Copy-Item "LICENSE" "$root/LICENSE" -Force
          }

          if (Test-Path "README.md") {
            Copy-Item "README.md" "$root/README.md" -Force
          }

          if (Test-Path "agent.md") {
            Copy-Item "agent.md" "$root/AI-CONTEXT.md" -Force
          }

          if (Test-Path "SIGNATURE") {
            Copy-Item "SIGNATURE" "$root/SIGNATURE" -Force
          }

          if (Test-Path "SHEYTAN-LA.bat") {
            Copy-Item `
              "SHEYTAN-LA.bat" `
              "$root/SHEYTAN-LA.bat" `
              -Force
          }

      - name: Create Windows ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "dist" | Out-Null

          $zip = "dist/${env:WIN_PKG_ROOT}-v${env:APP_VERSION}-windows-x64.zip"

          if (Test-Path $zip) {
            Remove-Item $zip -Force
          }

          Compress-Archive `
            -Path "dist/windows/app/${env:WIN_PKG_ROOT}" `
            -DestinationPath $zip `
            -CompressionLevel Optimal

          if (-not (Test-Path $zip)) {
            throw "Windows ZIP was not created."
          }

          if ((Get-Item $zip).Length -le 0) {
            throw "Windows ZIP is empty."
          }

      - name: Verify Windows ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Add-Type -AssemblyName System.IO.Compression.FileSystem

          # v1.2.1: every expected entry is rooted at the canonical
          # WIN_PKG_ROOT — the same variable that staged and zipped the
          # application. No duplicated root literal exists to drift.
          $zipPath = Resolve-Path `
            "dist/${env:WIN_PKG_ROOT}-v${env:APP_VERSION}-windows-x64.zip"

          $archive = [System.IO.Compression.ZipFile]::OpenRead($zipPath)

          try {
            $entries = @(
              $archive.Entries |
              ForEach-Object { $_.FullName }
            )

            $required = @(
              "${env:WIN_PKG_ROOT}/SHEYTAN-LA.exe",
              "${env:WIN_PKG_ROOT}/README.txt",
              "${env:WIN_PKG_ROOT}/BUILD-INFO.txt",
              "${env:WIN_PKG_ROOT}/models/README.txt",
              "${env:WIN_PKG_ROOT}/workspace/README.txt"
            )

            foreach ($item in $required) {
              if ($entries -notcontains $item) {
                throw "Missing ZIP entry: $item"
              }
            }

            if (
              (Test-Path "SHEYTAN-LA.bat") -and
              ($entries -notcontains "${env:WIN_PKG_ROOT}/SHEYTAN-LA.bat")
            ) {
              throw "Expected launcher script is missing from Windows ZIP."
            }

            # Release metadata inside the package must carry the identity:
            # BUILD-INFO.txt is the in-archive version authority.
            $buildInfo = $archive.Entries |
              Where-Object { $_.FullName -eq "${env:WIN_PKG_ROOT}/BUILD-INFO.txt" }
            $reader = New-Object System.IO.StreamReader($buildInfo.Open())
            $buildText = $reader.ReadToEnd()
            $reader.Dispose()

            if ($buildText -notmatch [regex]::Escape("Version: $env:APP_VERSION")) {
              throw "BUILD-INFO.txt inside the ZIP does not carry version $env:APP_VERSION."
            }

            Write-Host "Windows ZIP structure verification passed."
          }
          finally {
            $archive.Dispose()
          }

      - name: Verify Windows ZIP integrity
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Add-Type -AssemblyName System.IO.Compression.FileSystem

          $zipPath = Resolve-Path `
            "dist/${env:WIN_PKG_ROOT}-v${env:APP_VERSION}-windows-x64.zip"

          $archive = [System.IO.Compression.ZipFile]::OpenRead($zipPath)

          try {
            foreach ($entry in $archive.Entries) {
              $stream = $entry.Open()

              try {
                $buffer = New-Object byte[] 65536

                while ($true) {
                  $read = $stream.Read($buffer, 0, $buffer.Length)

                  if ($read -eq 0) {
                    break
                  }
                }
              }
              finally {
                $stream.Dispose()
              }
            }
          }
          finally {
            $archive.Dispose()
          }

          Write-Host "Windows ZIP integrity verification passed."

      - name: Build Windows NSIS installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # v1.2.0: the primary user installer. NSIS is the broad Win32
          # distribution path; the portable ZIP remains the advanced
          # option. Models are NEVER bundled — the installer ships the
          # application only.
          #
          # PATH CONTRACT (v1.2.0): makensis resolves compile-time paths
          # relative to the .nsi SCRIPT directory, not the invoking CWD —
          # the previous repo-root-relative -DBUILDDIR made it look under
          # packaging\nsis\dist\... and fail with "no files found". CI
          # passes ABSOLUTE BUILDDIR/OUTFILE paths, which are unambiguous
          # from any invocation context, and the script itself asserts the
          # staging executable exists before compiling anything.
          choco install nsis -y --no-progress

          $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) {
            $found = Get-ChildItem "C:\Program Files*" -Recurse -Filter makensis.exe -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if ($null -eq $found) { throw "makensis.exe not found after NSIS install." }
            $makensis = $found.FullName
          }

          # Pre-flight assertions: refuse to invoke NSIS against a broken
          # staging tree — the exact executable, at the exact stage path.
          # v1.2.1: the staging path derives from the canonical root.
          $repoRoot = (Get-Location).Path
          $stagingDir = Join-Path $repoRoot "dist\windows\app\${env:WIN_PKG_ROOT}"
          $stagingExe = Join-Path $stagingDir "SHEYTAN-LA.exe"

          if (-not (Test-Path $stagingDir)) {
            throw "NSIS staging directory missing: $stagingDir"
          }
          if (-not (Test-Path $stagingExe)) {
            throw "NSIS staging executable missing: $stagingExe"
          }

          # v1.2.1: NSIS installer source-contract — the installer MUST
          # keep the directory-selection page, the optional desktop
          # shortcut (default checked), a registered uninstaller, and the
          # user-data-preserving uninstall section. Checking the SOURCE
          # here means a silent regression fails CI before any installer
          # is built from a weakened script.
          $nsi = Get-Content "packaging/nsis/installer.nsi" -Raw
          $nsiContract = @(
            "MUI_PAGE_DIRECTORY",
            "Create a &desktop shortcut",
            "BST_CHECKED",
            "WriteUninstaller",
            "UninstallString",
            "SHEYTAN_DATA_DIR",
            "preserve user data"
          )
          foreach ($fragment in $nsiContract) {
            if ($nsi -notmatch [regex]::Escape($fragment)) {
              throw "installer.nsi lost required contract fragment: $fragment"
            }
          }

          # Negative contract: the uninstaller must NEVER contain the
          # recursive-delete instruction — user data is preserved by
          # construction, not by discipline.
          if ($nsi -match [regex]::Escape("RMDir /r")) {
            throw "installer.nsi contains 'RMDir /r' — recursive deletes are forbidden in the uninstaller (user data must be preserved)."
          }
          Write-Host "NSIS source contract verified (directory page, shortcut option, uninstaller, no recursive deletes)."

          $installerPath = Join-Path $repoRoot "dist\${env:WIN_PKG_ROOT}-v${env:APP_VERSION}-windows-x64-installer.exe"

          & $makensis `
            -DVERSION="$env:APP_VERSION" `
            -DEXE="SHEYTAN-LA.exe" `
            -DBUILDDIR="$stagingDir" `
            -DOUTFILE="$installerPath" `
            "packaging\nsis\installer.nsi"

          if ($LASTEXITCODE -ne 0) {
            throw "makensis exited with code $LASTEXITCODE."
          }

          # Post-build assertions: the installer must exist, be non-empty,
          # and its version resource must carry the release identity.
          if (-not (Test-Path $installerPath)) {
            throw "NSIS installer was not produced."
          }
          if ((Get-Item $installerPath).Length -le 0) {
            throw "NSIS installer is empty."
          }

          $versionInfo = (Get-Item $installerPath).VersionInfo
          if ($versionInfo.ProductVersion -ne $env:APP_VERSION) {
            throw "Installer ProductVersion '$($versionInfo.ProductVersion)' != APP_VERSION '$env:APP_VERSION'."
          }
          if ($versionInfo.ProductName -ne "SHEYTAN-LA") {
            throw "Installer ProductName '$($versionInfo.ProductName)' != expected identity 'SHEYTAN-LA'."
          }

          Write-Host "NSIS installer built: $installerPath"

      - name: Verify Windows installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $installer = Get-Item "dist/${env:WIN_PKG_ROOT}-v${env:APP_VERSION}-windows-x64-installer.exe"

          if ($installer.Length -lt 1MB) {
            throw "Installer is implausibly small ($($installer.Length) bytes) — refusing to publish."
          }

          # Authenticode state is REPORTED, never faked: unsigned builds are
          # expected until signing credentials are configured.
          $sig = Get-AuthenticodeSignature $installer.FullName
          Write-Host "Installer Authenticode status: $($sig.Status)"

          # v1.2.0: structural inspection instead of trusting the exit
          # code — the installer must be a valid PE carrying the identity.
          $bytes = New-Object byte[] 2
          $fs = [System.IO.File]::OpenRead($installer.FullName)
          try { $null = $fs.Read($bytes, 0, 2) } finally { $fs.Dispose() }
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) {
            throw "Installer is not a valid PE executable (missing MZ header)."
          }

          $vi = $installer.VersionInfo
          if ($vi.ProductName -ne "SHEYTAN-LA") {
            throw "Installer ProductName '$($vi.ProductName)' != expected identity 'SHEYTAN-LA'."
          }

          Write-Host "Installer identity: $($vi.ProductName) v$($vi.ProductVersion) ($([math]::Round($installer.Length/1MB,1)) MB)"

          Write-Host "Installer verification passed: $($installer.Name) ($([math]::Round($installer.Length/1MB,1)) MB)"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.WIN_PKG_ROOT }}-Windows-x64-installer-v${{ env.APP_VERSION }}
          path: dist/${{ env.WIN_PKG_ROOT }}-v${{ env.APP_VERSION }}-windows-x64-installer.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload Windows package
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.WIN_PKG_ROOT }}-Windows-x64-v${{ env.APP_VERSION }}
          path: dist/${{ env.WIN_PKG_ROOT }}-v${{ env.APP_VERSION }}-windows-x64.zip
          if-no-files-found: error
          retention-days: 30

  build-linux:
    name: Linux x64
    needs: audit
    timeout-minutes: 50

    # v1.1.8: identity flows from the audit job's runtime resolution of
    # package.json — no local hardcoded version can drift here either.
    env:
      APP_VERSION: ${{ needs.audit.outputs.version }}
      APP_VERSION_FULL: ${{ needs.audit.outputs.version_full }}
      APP_CODENAME: ${{ needs.audit.outputs.codename }}
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          package-manager-cache: true

      - name: Verify Node and repository
        shell: bash
        run: |
          set -euo pipefail

          node --version
          npm --version

          node_major="$(node -p 'process.versions.node.split(".")[0]')"
          test "$node_major" -ge 24

          test -f package.json
          test -f package-lock.json
          test -f go.mod
          test -f go.sum
          test ! -e web/package.json

      - name: Install Linux build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev \
            libglib2.0-dev \
            libsoup-3.0-dev \
            zip \
            unzip \
            file

      - name: Verify Linux build environment
        shell: bash
        run: |
          set -euo pipefail

          gcc --version
          g++ --version
          make --version
          pkg-config --version

          pkg-config --modversion gtk4
          pkg-config --modversion webkitgtk-6.0
          pkg-config --modversion libsoup-3.0

          command -v zip
          command -v unzip
          command -v file

      - name: Synchronize Zeta release metadata
        shell: bash
        run: node scripts/release-version.mjs

      - name: Verify release metadata
        shell: bash
        run: |
          set -euo pipefail

          grep -F "AppVersion  = \"$APP_VERSION\"" internal/config/config.go
          grep -F "\"version\": \"$APP_VERSION_FULL\"" package.json
          grep -F "productVersion: \"$APP_VERSION_FULL\"" build/config.yml
          grep -F "SHEYTAN-Local-Agent v$APP_VERSION" SIGNATURE

      - name: Install frontend dependencies
        shell: bash
        run: npm ci

      - name: Frontend verification
        shell: bash
        run: |
          set -euo pipefail

          npm run typecheck
          npm run lint
          npm run build

      - name: Verify embedded frontend
        shell: bash
        run: |
          set -euo pipefail

          test -f web/static/index.html
          grep -q '<div id="root"></div>' web/static/index.html

      - name: Setup Go 1.26
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # v1.1.5Z Phase 5 repair: build the C++ engine BEFORE the Go tests
      # so the Go↔C++ integration suites (internal/native/engine
      # TestRealCppHost*) run against the REAL shtn-engine-host binary
      # instead of skipping. The audit job builds and ctests the engine,
      # but on its own runner/workspace — without this step the boundary
      # tests never actually executed in any Go job.
      # v1.2.1: same source-hash cache as the audit job.
      - name: Cache native engine build
        uses: actions/cache@v5
        with:
          path: native/engine/build
          key: native-engine-${{ runner.os }}-${{ hashFiles('native/engine/**') }}

      - name: Native engine (C++) build for Go integration tests
        shell: bash
        run: |
          set -euo pipefail

          cmake -S native/engine -B native/engine/build
          cmake --build native/engine/build
          ctest --test-dir native/engine/build --output-on-failure

          test -x native/engine/build/shtn-engine-host

      - name: Go verification
        shell: bash
        env:
          CGO_ENABLED: "1"
        run: |
          set -euo pipefail

          go version

          go test ./internal/... -tags headless -count=1
          go test ./... -run Test -count=1
          go vet ./...

          go list -m github.com/wailsapp/wails/v3

      - name: Stress suite
        shell: bash
        env:
          CGO_ENABLED: "1"
        run: |
          set -euo pipefail

          go build \
            -trimpath \
            -ldflags="-s -w" \
            -o /tmp/sheytan-stress \
            ./scripts/stress-main

          test -x /tmp/sheytan-stress

          /tmp/sheytan-stress stress

      - name: Build Linux executable
        shell: bash
        env:
          CGO_ENABLED: "1"
          GOOS: linux
          GOARCH: amd64
        run: |
          set -euo pipefail

          # v1.2.1: staging root derives from the canonical LINUX_PKG_ROOT.
          mkdir -p "dist/linux/app/${LINUX_PKG_ROOT}"

          go build \
            -trimpath \
            -ldflags="-s -w" \
            -o "dist/linux/app/${LINUX_PKG_ROOT}/SHEYTAN-Local-Agent" \
            .

      - name: Verify Linux executable
        shell: bash
        run: |
          set -euo pipefail

          exe="dist/linux/app/${LINUX_PKG_ROOT}/SHEYTAN-Local-Agent"

          test -f "$exe"
          test -x "$exe"

          file "$exe"

          size="$(stat -c '%s' "$exe")"

          if [ "$size" -le 1000000 ]; then
            echo "Linux executable is suspiciously small: $size bytes"
            exit 1
          fi

          echo "Linux executable size: $size bytes"

          set +e
          output="$("$exe" version 2>&1)"
          exit_code=$?
          set -e

          printf '%s\n' "$output"
          echo "=== Linux version command exit code: $exit_code ==="

          if [ "$exit_code" -ne 0 ]; then
            echo "Linux version command exited with $exit_code."
            exit 1
          fi

          grep -Fq \
            "SHEYTAN-Local-Agent v${APP_VERSION}" \
            <<< "$output"

          grep -Eq \
            'os:[[:space:]]+linux/amd64' \
            <<< "$output"

          echo "Linux executable version/platform smoke test passed."

      - name: Prepare Linux portable package
        shell: bash
        run: |
          set -euo pipefail

          # v1.2.1: canonical package root — the same single value controls
          # staging, ZIP creation, ZIP verification and artifact naming.
          root="dist/linux/app/${LINUX_PKG_ROOT}"

          mkdir -p \
            "$root/models" \
            "$root/workspace"

          cat > "$root/README.txt" <<EOF
          SHEYTAN-Local-Agent ${APP_VERSION} (${APP_CODENAME})

          Portable Linux x64 distribution.

          Keep the complete SHEYTAN-Local-Agent folder together.
          EOF

          cat > "$root/models/README.txt" <<EOF
          LOCAL MODELS

          Place GGUF models in this folder.
          EOF

          cat > "$root/workspace/README.txt" <<EOF
          CODING LAB

          Portable Coding Lab workspaces live under this folder.
          EOF

          cat > "$root/BUILD-INFO.txt" <<EOF
          SHEYTAN-Local-Agent
          Version: ${APP_VERSION}
          Codename: ${APP_CODENAME}
          Platform: Linux x64
          Commit: ${GITHUB_SHA}
          EOF

          if [ -f LICENSE ]; then
            cp LICENSE "$root/LICENSE"
          fi

          if [ -f README.md ]; then
            cp README.md "$root/README.md"
          fi

          if [ -f agent.md ]; then
            cp agent.md "$root/AI-CONTEXT.md"
          fi

          if [ -f SIGNATURE ]; then
            cp SIGNATURE "$root/SIGNATURE"
          fi

      - name: Verify Linux package contents before ZIP
        shell: bash
        run: |
          set -euo pipefail

          root="dist/linux/app/${LINUX_PKG_ROOT}"

          test -f "$root/SHEYTAN-Local-Agent"
          test -x "$root/SHEYTAN-Local-Agent"
          test -f "$root/README.txt"
          test -f "$root/BUILD-INFO.txt"
          test -f "$root/models/README.txt"
          test -f "$root/workspace/README.txt"

          if [ -f LICENSE ]; then
            test -f "$root/LICENSE"
          fi

          if [ -f README.md ]; then
            test -f "$root/README.md"
          fi

          if [ -f agent.md ]; then
            test -f "$root/AI-CONTEXT.md"
          fi

          if [ -f SIGNATURE ]; then
            test -f "$root/SIGNATURE"
          fi

          echo "Linux package content verification passed."

      - name: Create Linux ZIP
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist

          zip="dist/${LINUX_PKG_ROOT}-Linux-x64-v${APP_VERSION}Z.zip"

          rm -f "$zip"

          (
            cd dist/linux/app
            zip -r -9 "../../../$zip" "${LINUX_PKG_ROOT}"
          )

          test -f "$zip"
          test -s "$zip"

      # v1.2.1 THE FIX (run 34871838054): this verifier used to expect
      # SHEYTAN-LA/… entries while the ZIP was created under the
      # SHEYTAN-Local-Agent/ root. Every expected entry now derives from
      # the ONE canonical LINUX_PKG_ROOT variable that also staged and
      # zipped the application — the mismatch class is structurally gone,
      # and the verifier is STRICTER than before (version-checked
      # BUILD-INFO content on top of the entry list).
      - name: Verify Linux ZIP
        shell: bash
        run: |
          set -euo pipefail

          zip="dist/${LINUX_PKG_ROOT}-Linux-x64-v${APP_VERSION}Z.zip"

          test -f "$zip"
          test -s "$zip"

          unzip -t "$zip" >/dev/null

          entries="$(unzip -Z1 "$zip")"

          # Every expected entry references the canonical root DIRECTLY
          # (no intermediate aliases): the stress gate pins these exact
          # spellings so the verifier provably derives from
          # LINUX_PKG_ROOT — the same variable that staged and zipped.
          grep -Fxq \
            "${LINUX_PKG_ROOT}/SHEYTAN-Local-Agent" \
            <<< "$entries"

          grep -Fxq \
            "${LINUX_PKG_ROOT}/README.txt" \
            <<< "$entries"

          grep -Fxq \
            "${LINUX_PKG_ROOT}/BUILD-INFO.txt" \
            <<< "$entries"

          grep -Fxq \
            "${LINUX_PKG_ROOT}/models/README.txt" \
            <<< "$entries"

          grep -Fxq \
            "${LINUX_PKG_ROOT}/workspace/README.txt" \
            <<< "$entries"

          if [ -f LICENSE ]; then
            grep -Fxq \
              "${LINUX_PKG_ROOT}/LICENSE" \
              <<< "$entries"
          fi

          if [ -f README.md ]; then
            grep -Fxq \
              "${LINUX_PKG_ROOT}/README.md" \
              <<< "$entries"
          fi

          if [ -f agent.md ]; then
            grep -Fxq \
              "${LINUX_PKG_ROOT}/AI-CONTEXT.md" \
              <<< "$entries"
          fi

          if [ -f SIGNATURE ]; then
            grep -Fxq \
              "${LINUX_PKG_ROOT}/SIGNATURE" \
              <<< "$entries"
          fi

          # In-package release metadata must carry the resolved identity.
          grep -Fq "Version: ${APP_VERSION}" \
            <(unzip -p "$zip" "${LINUX_PKG_ROOT}/BUILD-INFO.txt")

          echo "Linux ZIP integrity and content verification passed."

      - name: Upload Linux package
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.LINUX_PKG_ROOT }}-Linux-x64-v${{ env.APP_VERSION }}Z
          path: dist/${{ env.LINUX_PKG_ROOT }}-Linux-x64-v${{ env.APP_VERSION }}Z.zip
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish and verify ${{ github.ref_name }}
    needs:
      - build-windows
      - build-linux
      - audit
    timeout-minutes: 20

    # v1.1.8: the release job consumes the audit job's runtime-resolved
    # identity (package.json) — it needs no checkout to verify the tag.
    env:
      APP_VERSION: ${{ needs.audit.outputs.version }}
      APP_VERSION_FULL: ${{ needs.audit.outputs.version_full }}
      APP_CODENAME: ${{ needs.audit.outputs.codename }}

    # v1.1.4Z: version-agnostic gate — the job runs for any v* tag and the
    # first step verifies the tag equals v${APP_VERSION}Z. The previous
    # hardcode silently skipped the release job on every version bump
    # until someone remembered to edit this file (the single most
    # dangerous trap in the old pipeline).
    if: startsWith(github.ref, 'refs/tags/v')

    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - name: Verify release tag
        shell: bash
        run: |
          set -euo pipefail

          test "${GITHUB_REF_NAME}" = "v${APP_VERSION}Z"

          echo "Release tag verified: ${GITHUB_REF_NAME}"

      - name: Download Windows package
        uses: actions/download-artifact@v7
        with:
          name: ${{ env.WIN_PKG_ROOT }}-Windows-x64-v${{ env.APP_VERSION }}
          path: dist/windows

      - name: Download Windows installer
        uses: actions/download-artifact@v7
        with:
          name: ${{ env.WIN_PKG_ROOT }}-Windows-x64-installer-v${{ env.APP_VERSION }}
          path: dist/installer

      - name: Download Linux package
        uses: actions/download-artifact@v7
        with:
          name: ${{ env.LINUX_PKG_ROOT }}-Linux-x64-v${{ env.APP_VERSION }}Z
          path: dist/linux

      - name: Verify release ZIP payloads
        shell: bash
        run: |
          set -euo pipefail

          # v1.2.1: artifact names derive from the canonical roots.
          windows_zip_name="${WIN_PKG_ROOT}-v${APP_VERSION}-windows-x64.zip"
          linux_zip_name="${LINUX_PKG_ROOT}-Linux-x64-v${APP_VERSION}Z.zip"
          installer_name="${WIN_PKG_ROOT}-v${APP_VERSION}-windows-x64-installer.exe"

          windows="$(find dist/windows -type f -name "$windows_zip_name" -print -quit)"
          linux="$(find dist/linux -type f -name "$linux_zip_name" -print -quit)"
          installer="$(find dist/installer -type f -name "$installer_name" -print -quit)"

          test -n "$windows"
          test -n "$linux"
          test -n "$installer"

          test -f "$windows"
          test -f "$linux"
          test -f "$installer"

          test -s "$windows"
          test -s "$linux"
          test -s "$installer"

          echo "Found Windows ZIP: $windows"
          echo "Found Linux ZIP:   $linux"
          echo "Found installer:   $installer"

          unzip -t "$windows" >/dev/null
          unzip -t "$linux" >/dev/null

          windows_entries="$(unzip -Z1 "$windows")"
          linux_entries="$(unzip -Z1 "$linux")"

          win_root="${WIN_PKG_ROOT}"
          linux_root="${LINUX_PKG_ROOT}"

          grep -Fxq \
            "${win_root}/SHEYTAN-LA.exe" \
            <<< "$windows_entries"

          grep -Fxq \
            "${win_root}/README.txt" \
            <<< "$windows_entries"

          grep -Fxq \
            "${win_root}/BUILD-INFO.txt" \
            <<< "$windows_entries"

          grep -Fxq \
            "${win_root}/models/README.txt" \
            <<< "$windows_entries"

          grep -Fxq \
            "${win_root}/workspace/README.txt" \
            <<< "$windows_entries"

          grep -Fxq \
            "${linux_root}/SHEYTAN-Local-Agent" \
            <<< "$linux_entries"

          grep -Fxq \
            "${linux_root}/README.txt" \
            <<< "$linux_entries"

          grep -Fxq \
            "${linux_root}/BUILD-INFO.txt" \
            <<< "$linux_entries"

          grep -Fxq \
            "${linux_root}/models/README.txt" \
            <<< "$linux_entries"

          grep -Fxq \
            "${linux_root}/workspace/README.txt" \
            <<< "$linux_entries"

          if grep -Fxq \
            "${win_root}/LICENSE" \
            <<< "$windows_entries"; then
            echo "Windows LICENSE present."
          fi

          if grep -Fxq \
            "${win_root}/README.md" \
            <<< "$windows_entries"; then
            echo "Windows README.md present."
          fi

          if grep -Fxq \
            "${win_root}/AI-CONTEXT.md" \
            <<< "$windows_entries"; then
            echo "Windows AI-CONTEXT.md present."
          fi

          if grep -Fxq \
            "${win_root}/SIGNATURE" \
            <<< "$windows_entries"; then
            echo "Windows SIGNATURE present."
          fi

          if grep -Fxq \
            "${linux_root}/LICENSE" \
            <<< "$linux_entries"; then
            echo "Linux LICENSE present."
          fi

          if grep -Fxq \
            "${linux_root}/README.md" \
            <<< "$linux_entries"; then
            echo "Linux README.md present."
          fi

          if grep -Fxq \
            "${linux_root}/AI-CONTEXT.md" \
            <<< "$linux_entries"; then
            echo "Linux AI-CONTEXT.md present."
          fi

          if grep -Fxq \
            "${linux_root}/SIGNATURE" \
            <<< "$linux_entries"; then
            echo "Linux SIGNATURE present."
          fi

          # Installer must be a real PE executable (MZ header), non-trivial.
          installer_head="$(head -c 2 "$installer")"
          test "$installer_head" = "MZ"

          echo "WINDOWS_ZIP=$windows" >> "$GITHUB_ENV"
          echo "LINUX_ZIP=$linux" >> "$GITHUB_ENV"
          echo "INSTALLER=$installer" >> "$GITHUB_ENV"

          echo "Release payload verification passed."

      - name: Generate SHA256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd "$(dirname "$WINDOWS_ZIP")"
          sha256sum "$(basename "$WINDOWS_ZIP")" "$(basename "$INSTALLER")" > SHA256SUMS.txt
          cd - >/dev/null
          ( cd dist/linux && sha256sum "$(basename "$LINUX_ZIP")" >> ../SHA256SUMS.txt )
          mv dist/SHA256SUMS.txt SHA256SUMS.txt 2>/dev/null || true
          # Normalize: everything at repo-root-relative dist level.
          test -s SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Generate release manifest
        shell: bash
        run: |
          set -euo pipefail

          # The update manifest is the authoritative machine-readable release
          # source consumed by the app's updater (internal/updater/appupdate).
          win_zip="$(basename "$WINDOWS_ZIP")"
          win_inst="$(basename "$INSTALLER")"

          win_zip_sha="$(sha256sum "$WINDOWS_ZIP" | cut -d' ' -f1)"
          win_inst_sha="$(sha256sum "$INSTALLER" | cut -d' ' -f1)"

          tag_base="${APP_VERSION}"

          cat > release-manifest.json <<EOF
          {
            "version": "${tag_base}",
            "channel": "stable",
            "notes": "SHEYTAN-LA ${tag_base} — unified product release",
            "publishedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "windows-x64": {
                "url": "https://github.com/${GITHUB_REPOSITORY}/releases/download/v${tag_base}Z/${win_inst}",
                "sha256": "${win_inst_sha}",
                "kind": "installer"
              }
            },
            "artifacts": {
              "windows-x64-zip": {
                "url": "https://github.com/${GITHUB_REPOSITORY}/releases/download/v${tag_base}Z/${win_zip}",
                "sha256": "${win_zip_sha}",
                "kind": "zip"
              }
            }
          }
          EOF

          python3 -m json.tool release-manifest.json >/dev/null
          echo "release-manifest.json generated and validated."

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: SHEYTAN-LA ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            ${{ env.WINDOWS_ZIP }}
            ${{ env.INSTALLER }}
            ${{ env.LINUX_ZIP }}
            SHA256SUMS.txt
            release-manifest.json

      - name: Verify published release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          payload="$(
            gh release view \
              "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --json tagName,isDraft,isPrerelease,assets
          )"

          echo "$payload"

          windows_asset="${WIN_PKG_ROOT}-v${APP_VERSION}-windows-x64.zip"
          linux_asset="${LINUX_PKG_ROOT}-Linux-x64-v${APP_VERSION}Z.zip"
          installer_asset="${WIN_PKG_ROOT}-v${APP_VERSION}-windows-x64-installer.exe"

          echo "$payload" |
            jq -e \
              --arg tag "${GITHUB_REF_NAME}" \
              --arg windows "$windows_asset" \
              --arg linux "$linux_asset" \
              --arg installer "$installer_asset" \
              '
                .tagName == $tag and
                .isDraft == false and
                .isPrerelease == false and
                ([.assets[].name] | index($windows)) != null and
                ([.assets[].name] | index($linux)) != null and
                ([.assets[].name] | index($installer)) != null and
                ([.assets[].name] | index("SHA256SUMS.txt")) != null and
                ([.assets[].name] | index("release-manifest.json")) != null
              ' \
            >/dev/null

          echo "${GITHUB_REF_NAME} release asset verification passed."
