name: Build Desktop

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: sheytan-desktop-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

# v1.1.8: the release identity is NOT hardcoded here anymore. package.json
# is the single source of truth; the audit job resolves it at runtime
# (scripts/release-version.mjs --env) and every other job consumes it via
# needs-outputs. A version bump therefore only touches package.json + the
# derived surfaces the script repairs — a stale env constant can never
# desync CI again (root cause of run 34788709977).
env:
  GO_VERSION: "1.26"
  NODE_VERSION: "24"

jobs:
  audit:
    name: Source & frontend audit
    runs-on: ubuntu-24.04

    # v1.1.9: the identity step emits APP_VERSION / APP_VERSION_FULL /
    # APP_CODENAME (exactly as release-version.mjs --env names them). Run
    # 34791882219 failed because these mappings pointed at lowercase names
    # (steps.identity.outputs.version) that the step never writes, so every
    # needs.audit.outputs.* resolved to an empty string and the Linux/Windows
    # release-metadata verification failed on empty APP_VERSION. The output
    # names here MUST match the keys written to GITHUB_OUTPUT below.
    outputs:
      version: ${{ steps.identity.outputs.APP_VERSION }}
      version_full: ${{ steps.identity.outputs.APP_VERSION_FULL }}
      codename: ${{ steps.identity.outputs.APP_CODENAME }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          package-manager-cache: true

      - name: Verify repository shape and release identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail

          test -f package.json
          test -f package-lock.json
          test -f go.mod
          test -f go.sum
          test -f internal/config/config.go
          test -f src/App.tsx
          test -f src/AgentBody.tsx
          test -f src/styles.css
          test ! -e web/package.json

          node --version
          npm --version

          node_major="$(node -p 'process.versions.node.split(".")[0]')"
          test "$node_major" -ge 24

          node scripts/release-version.mjs

          # v1.1.8: derive the release identity from package.json (the one
          # canonical source) instead of trusting a workflow env constant.
          identity_out="$(node scripts/release-version.mjs --env)"

          while IFS='=' read -r key value; do
            case "$key" in
              APP_VERSION | APP_VERSION_FULL | APP_CODENAME)
                export "$key=$value"
                printf '%s=%s\n' "$key" "$value" >> "$GITHUB_OUTPUT"
                ;;
            esac
          done <<< "$identity_out"

          # v1.1.9: fail fast here — before any expensive build job starts —
          # if the release identity did not resolve. An empty value used to
          # surface only later as a cryptic metadata-verification failure in
          # Linux/Windows (root cause of run 34791882219).
          if [ -z "${APP_VERSION:-}" ] || [ -z "${APP_VERSION_FULL:-}" ] || [ -z "${APP_CODENAME:-}" ]; then
            echo "::error::Release identity did not resolve. APP_VERSION, APP_VERSION_FULL and APP_CODENAME must all be non-empty after 'release-version.mjs --env'."
            exit 1
          fi

          # The identity step must be tagged so needs-outputs can read it
          # (id: identity above). Job outputs map from the APP_* names.
          echo "Resolved identity: $APP_VERSION / $APP_VERSION_FULL / $APP_CODENAME"

          # Belt and suspenders: the repaired tree must pass check mode.
          node scripts/release-version.mjs --check

          grep -F "AppVersion  = \"$APP_VERSION\"" internal/config/config.go
          grep -F "\"version\": \"$APP_VERSION_FULL\"" package.json
          grep -F "productVersion: \"$APP_VERSION_FULL\"" build/config.yml
          grep -F "SHEYTAN-Local-Agent v$APP_VERSION" SIGNATURE

      - name: Install frontend dependencies
        shell: bash
        run: npm ci

      - name: Frontend verification
        shell: bash
        run: |
          set -euo pipefail

          npm run typecheck
          npm run lint
          npm run build

      - name: Verify embedded frontend
        shell: bash
        run: |
          set -euo pipefail

          test -f web/static/index.html
          grep -q '<div id="root"></div>' web/static/index.html

          echo "Embedded frontend verification passed."

      # v1.1.5Z Phase 1: the C++ native engine skeleton builds and its
      # dependency-free test suites pass on the same runner the Go build
      # uses. Ubuntu-24.04 images ship cmake (>= 3.28) and g++.
      - name: Native engine (C++) build and tests
        shell: bash
        run: |
          set -euo pipefail

          cmake --version
          cmake -S native/engine -B native/engine/build
          cmake --build native/engine/build
          ctest --test-dir native/engine/build --output-on-failure

          test -x native/engine/build/shtn-engine-host
          echo "Native engine verification passed."

  build-windows:
    name: Windows x64
    needs: audit

    # v1.1.8: identity flows from the audit job's runtime resolution of
    # package.json — no local hardcoded version can drift here either.
    env:
      APP_VERSION: ${{ needs.audit.outputs.version }}
      APP_VERSION_FULL: ${{ needs.audit.outputs.version_full }}
      APP_CODENAME: ${{ needs.audit.outputs.codename }}
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          package-manager-cache: true

      - name: Verify Node and repository
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          node --version
          npm --version

          $nodeMajor = [int](node --version).TrimStart("v").Split(".")[0]

          if ($nodeMajor -lt 24) {
            throw "Node.js 24 or newer is required."
          }

          if (-not (Test-Path "package.json")) {
            throw "Root package.json missing."
          }

          if (-not (Test-Path "package-lock.json")) {
            throw "Root package-lock.json missing."
          }

          if (-not (Test-Path "go.mod")) {
            throw "go.mod missing."
          }

          if (-not (Test-Path "go.sum")) {
            throw "go.sum missing."
          }

          if (Test-Path "web/package.json") {
            throw "Unexpected web/package.json found."
          }

      - name: Synchronize Zeta release metadata
        shell: pwsh
        run: node scripts/release-version.mjs

      - name: Verify release metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # v1.1.4Z CI repair: the original step reused Bash-style
          # backslash-quote escaping inside PowerShell strings. PowerShell
          # terminates the string at the quote after the backslash, splits
          # the -Pattern argument into extra positional tokens and fails
          # with "A positional parameter cannot be found that accepts
          # argument". Single-quoted literals plus explicit concatenation
          # need no escaping, and the -Quiet boolean makes a missing match
          # FAIL the step (a bare Select-String pipeline exits 0 when
          # nothing matches, which would silently weaken this gate).
          $checks = @(
            @{
              Label   = "internal/config/config.go AppVersion"
              Path    = "internal/config/config.go"
              Pattern = 'AppVersion  = "' + $env:APP_VERSION + '"'
            },
            @{
              Label   = "package.json version"
              Path    = "package.json"
              Pattern = '"version": "' + $env:APP_VERSION_FULL + '"'
            },
            @{
              Label   = "build/config.yml productVersion"
              Path    = "build/config.yml"
              Pattern = 'productVersion: "' + $env:APP_VERSION_FULL + '"'
            },
            @{
              Label   = "SIGNATURE first line"
              Path    = "SIGNATURE"
              Pattern = 'SHEYTAN-Local-Agent v' + $env:APP_VERSION
            }
          )

          foreach ($check in $checks) {
            $found = Select-String -Path $check.Path -Pattern $check.Pattern -SimpleMatch -Quiet

            if (-not $found) {
              throw "Release metadata mismatch in $($check.Label): expected $($check.Pattern)"
            }

            Write-Host "Verified $($check.Label): $($check.Pattern)"
          }

      - name: Install frontend dependencies
        shell: pwsh
        run: npm ci

      - name: Frontend verification
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          npm run typecheck
          npm run lint
          npm run build

      - name: Verify embedded frontend
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (-not (Test-Path "web/static/index.html")) {
            throw "web/static/index.html was not generated."
          }

          $html = Get-Content "web/static/index.html" -Raw

          if ($html -notmatch '<div id="root"></div>') {
            throw "Embedded frontend root element was not found."
          }

          Write-Host "Embedded frontend verification passed."

      - name: Setup Go 1.26
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Go verification
        shell: pwsh
        env:
          CGO_ENABLED: "0"
        run: |
          $ErrorActionPreference = "Stop"

          go version

          go test ./internal/... -tags headless -count=1
          go test ./... -run Test -count=1
          go vet ./...

      - name: Generate Windows resources
        shell: pwsh
        env:
          CGO_ENABLED: "0"
        run: |
          $ErrorActionPreference = "Stop"

          go run ./scripts/gen-syso

          if (-not (Test-Path "rsrc_windows_amd64.syso")) {
            throw "Windows resource object was not generated."
          }

      - name: Build Windows executable and console smoke probe
        shell: pwsh
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
        run: |
          $ErrorActionPreference = "Stop"

          $appRoot = "dist/windows/app/SHEYTAN-Local-Agent"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $appRoot | Out-Null

          go build `
            -trimpath `
            -ldflags="-s -w -H=windowsgui" `
            -o "$appRoot/SHEYTAN-Local-Agent.exe" `
            .

          go build `
            -trimpath `
            -ldflags="-s -w" `
            -o "dist/windows/sheytan-version-smoke.exe" `
            .

      - name: Verify Windows executable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $exe = "dist/windows/app/SHEYTAN-Local-Agent/SHEYTAN-Local-Agent.exe"
          $probe = "dist/windows/sheytan-version-smoke.exe"

          if (-not (Test-Path $exe)) {
            throw "Windows executable was not produced."
          }

          if (-not (Test-Path $probe)) {
            throw "Windows console smoke probe was not produced."
          }

          $size = (Get-Item $exe).Length

          if ($size -lt 1000000) {
            throw "Windows executable is suspiciously small: $size bytes."
          }

          Write-Host "Windows executable size: $size bytes"

          $output = & $probe version 2>&1
          $exitCode = $LASTEXITCODE
          $text = ($output | Out-String).Trim()

          Write-Host "=== Windows console smoke probe ==="
          Write-Host $text
          Write-Host "=== Console probe exit code: $exitCode ==="

          if ($exitCode -ne 0) {
            throw "Windows console version probe exited with code $exitCode."
          }

          $expectedVersion = "SHEYTAN-Local-Agent v$($env:APP_VERSION)"

          if ($text -notmatch [regex]::Escape($expectedVersion)) {
            throw "Windows executable version mismatch. Expected: $expectedVersion"
          }

          if ($text -notmatch "os:\s+windows/amd64") {
            throw "Windows executable platform mismatch. Expected windows/amd64."
          }

          Write-Host "Windows executable version/platform smoke test passed."

          Remove-Item $probe -Force

      - name: Prepare Windows portable package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $root = "dist/windows/app/SHEYTAN-Local-Agent"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "$root/models" | Out-Null

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "$root/workspace" | Out-Null

          @"
          SHEYTAN-Local-Agent $env:APP_VERSION ($env:APP_CODENAME)

          Portable Windows x64 distribution.

          Keep the complete SHEYTAN-Local-Agent folder together.
          "@ | Set-Content "$root/README.txt" -Encoding utf8

          @"
          LOCAL MODELS

          Place GGUF models in this folder.
          "@ | Set-Content "$root/models/README.txt" -Encoding utf8

          @"
          CODING LAB

          Portable Coding Lab workspaces live under this folder.
          "@ | Set-Content "$root/workspace/README.txt" -Encoding utf8

          @"
          SHEYTAN-Local-Agent
          Version: $env:APP_VERSION
          Codename: $env:APP_CODENAME
          Platform: Windows x64
          Commit: $env:GITHUB_SHA
          "@ | Set-Content "$root/BUILD-INFO.txt" -Encoding utf8

          if (Test-Path "LICENSE") {
            Copy-Item "LICENSE" "$root/LICENSE" -Force
          }

          if (Test-Path "README.md") {
            Copy-Item "README.md" "$root/README.md" -Force
          }

          if (Test-Path "agent.md") {
            Copy-Item "agent.md" "$root/AI-CONTEXT.md" -Force
          }

          if (Test-Path "SIGNATURE") {
            Copy-Item "SIGNATURE" "$root/SIGNATURE" -Force
          }

          if (Test-Path "sheytan-local-agent.bat") {
            Copy-Item `
              "sheytan-local-agent.bat" `
              "$root/sheytan-local-agent.bat" `
              -Force
          }

      - name: Create Windows ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "dist" | Out-Null

          $zip = "dist/SHEYTAN-Local-Agent-Windows-x64-v${env:APP_VERSION}Z.zip"

          if (Test-Path $zip) {
            Remove-Item $zip -Force
          }

          Compress-Archive `
            -Path "dist/windows/app/SHEYTAN-Local-Agent" `
            -DestinationPath $zip `
            -CompressionLevel Optimal

          if (-not (Test-Path $zip)) {
            throw "Windows ZIP was not created."
          }

          if ((Get-Item $zip).Length -le 0) {
            throw "Windows ZIP is empty."
          }

      - name: Verify Windows ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Add-Type -AssemblyName System.IO.Compression.FileSystem

          $zipPath = Resolve-Path `
            "dist/SHEYTAN-Local-Agent-Windows-x64-v${env:APP_VERSION}Z.zip"

          $archive = [System.IO.Compression.ZipFile]::OpenRead($zipPath)

          try {
            $entries = @(
              $archive.Entries |
              ForEach-Object { $_.FullName }
            )

            $required = @(
              "SHEYTAN-Local-Agent/SHEYTAN-Local-Agent.exe",
              "SHEYTAN-Local-Agent/README.txt",
              "SHEYTAN-Local-Agent/BUILD-INFO.txt",
              "SHEYTAN-Local-Agent/models/README.txt",
              "SHEYTAN-Local-Agent/workspace/README.txt"
            )

            foreach ($item in $required) {
              if ($entries -notcontains $item) {
                throw "Missing ZIP entry: $item"
              }
            }

            if (
              (Test-Path "sheytan-local-agent.bat") -and
              ($entries -notcontains "SHEYTAN-Local-Agent/sheytan-local-agent.bat")
            ) {
              throw "Expected launcher script is missing from Windows ZIP."
            }

            Write-Host "Windows ZIP structure verification passed."
          }
          finally {
            $archive.Dispose()
          }

      - name: Verify Windows ZIP integrity
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Add-Type -AssemblyName System.IO.Compression.FileSystem

          $zipPath = Resolve-Path `
            "dist/SHEYTAN-Local-Agent-Windows-x64-v${env:APP_VERSION}Z.zip"

          $archive = [System.IO.Compression.ZipFile]::OpenRead($zipPath)

          try {
            foreach ($entry in $archive.Entries) {
              $stream = $entry.Open()

              try {
                $buffer = New-Object byte[] 65536

                while ($true) {
                  $read = $stream.Read($buffer, 0, $buffer.Length)

                  if ($read -eq 0) {
                    break
                  }
                }
              }
              finally {
                $stream.Dispose()
              }
            }
          }
          finally {
            $archive.Dispose()
          }

          Write-Host "Windows ZIP integrity verification passed."

      - name: Upload Windows package
        uses: actions/upload-artifact@v6
        with:
          name: SHEYTAN-Local-Agent-Windows-x64-v${{ env.APP_VERSION }}Z
          path: dist/SHEYTAN-Local-Agent-Windows-x64-v${{ env.APP_VERSION }}Z.zip
          if-no-files-found: error
          retention-days: 30

  build-linux:
    name: Linux x64
    needs: audit

    # v1.1.8: identity flows from the audit job's runtime resolution of
    # package.json — no local hardcoded version can drift here either.
    env:
      APP_VERSION: ${{ needs.audit.outputs.version }}
      APP_VERSION_FULL: ${{ needs.audit.outputs.version_full }}
      APP_CODENAME: ${{ needs.audit.outputs.codename }}
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          package-manager-cache: true

      - name: Verify Node and repository
        shell: bash
        run: |
          set -euo pipefail

          node --version
          npm --version

          node_major="$(node -p 'process.versions.node.split(".")[0]')"
          test "$node_major" -ge 24

          test -f package.json
          test -f package-lock.json
          test -f go.mod
          test -f go.sum
          test ! -e web/package.json

      - name: Install Linux build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev \
            libglib2.0-dev \
            libsoup-3.0-dev \
            zip \
            unzip \
            file

      - name: Verify Linux build environment
        shell: bash
        run: |
          set -euo pipefail

          gcc --version
          g++ --version
          make --version
          pkg-config --version

          pkg-config --modversion gtk4
          pkg-config --modversion webkitgtk-6.0
          pkg-config --modversion libsoup-3.0

          command -v zip
          command -v unzip
          command -v file

      - name: Synchronize Zeta release metadata
        shell: bash
        run: node scripts/release-version.mjs

      - name: Verify release metadata
        shell: bash
        run: |
          set -euo pipefail

          grep -F "AppVersion  = \"$APP_VERSION\"" internal/config/config.go
          grep -F "\"version\": \"$APP_VERSION_FULL\"" package.json
          grep -F "productVersion: \"$APP_VERSION_FULL\"" build/config.yml
          grep -F "SHEYTAN-Local-Agent v$APP_VERSION" SIGNATURE

      - name: Install frontend dependencies
        shell: bash
        run: npm ci

      - name: Frontend verification
        shell: bash
        run: |
          set -euo pipefail

          npm run typecheck
          npm run lint
          npm run build

      - name: Verify embedded frontend
        shell: bash
        run: |
          set -euo pipefail

          test -f web/static/index.html
          grep -q '<div id="root"></div>' web/static/index.html

      - name: Setup Go 1.26
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # v1.1.5Z Phase 5 repair: build the C++ engine BEFORE the Go tests
      # so the Go↔C++ integration suites (internal/native/engine
      # TestRealCppHost*) run against the REAL shtn-engine-host binary
      # instead of skipping. The audit job builds and ctests the engine,
      # but on its own runner/workspace — without this step the boundary
      # tests never actually executed in any Go job.
      - name: Native engine (C++) build for Go integration tests
        shell: bash
        run: |
          set -euo pipefail

          cmake -S native/engine -B native/engine/build
          cmake --build native/engine/build
          ctest --test-dir native/engine/build --output-on-failure

          test -x native/engine/build/shtn-engine-host

      - name: Go verification
        shell: bash
        env:
          CGO_ENABLED: "1"
        run: |
          set -euo pipefail

          go version

          go test ./internal/... -tags headless -count=1
          go test ./... -run Test -count=1
          go vet ./...

          go list -m github.com/wailsapp/wails/v3

      - name: Stress suite
        shell: bash
        env:
          CGO_ENABLED: "1"
        run: |
          set -euo pipefail

          go build \
            -trimpath \
            -ldflags="-s -w" \
            -o /tmp/sheytan-stress \
            ./scripts/stress-main

          test -x /tmp/sheytan-stress

          /tmp/sheytan-stress stress

      - name: Build Linux executable
        shell: bash
        env:
          CGO_ENABLED: "1"
          GOOS: linux
          GOARCH: amd64
        run: |
          set -euo pipefail

          mkdir -p dist/linux/app/SHEYTAN-Local-Agent

          go build \
            -trimpath \
            -ldflags="-s -w" \
            -o dist/linux/app/SHEYTAN-Local-Agent/SHEYTAN-Local-Agent \
            .

      - name: Verify Linux executable
        shell: bash
        run: |
          set -euo pipefail

          exe="dist/linux/app/SHEYTAN-Local-Agent/SHEYTAN-Local-Agent"

          test -f "$exe"
          test -x "$exe"

          file "$exe"

          size="$(stat -c '%s' "$exe")"

          if [ "$size" -le 1000000 ]; then
            echo "Linux executable is suspiciously small: $size bytes"
            exit 1
          fi

          echo "Linux executable size: $size bytes"

          set +e
          output="$("$exe" version 2>&1)"
          exit_code=$?
          set -e

          printf '%s\n' "$output"
          echo "=== Linux version command exit code: $exit_code ==="

          if [ "$exit_code" -ne 0 ]; then
            echo "Linux version command exited with $exit_code."
            exit 1
          fi

          grep -Fq \
            "SHEYTAN-Local-Agent v${APP_VERSION}" \
            <<< "$output"

          grep -Eq \
            'os:[[:space:]]+linux/amd64' \
            <<< "$output"

          echo "Linux executable version/platform smoke test passed."

      - name: Prepare Linux portable package
        shell: bash
        run: |
          set -euo pipefail

          root="dist/linux/app/SHEYTAN-Local-Agent"

          mkdir -p \
            "$root/models" \
            "$root/workspace"

          cat > "$root/README.txt" <<EOF
          SHEYTAN-Local-Agent ${APP_VERSION} (${APP_CODENAME})

          Portable Linux x64 distribution.

          Keep the complete SHEYTAN-Local-Agent folder together.
          EOF

          cat > "$root/models/README.txt" <<EOF
          LOCAL MODELS

          Place GGUF models in this folder.
          EOF

          cat > "$root/workspace/README.txt" <<EOF
          CODING LAB

          Portable Coding Lab workspaces live under this folder.
          EOF

          cat > "$root/BUILD-INFO.txt" <<EOF
          SHEYTAN-Local-Agent
          Version: ${APP_VERSION}
          Codename: ${APP_CODENAME}
          Platform: Linux x64
          Commit: ${GITHUB_SHA}
          EOF

          if [ -f LICENSE ]; then
            cp LICENSE "$root/LICENSE"
          fi

          if [ -f README.md ]; then
            cp README.md "$root/README.md"
          fi

          if [ -f agent.md ]; then
            cp agent.md "$root/AI-CONTEXT.md"
          fi

          if [ -f SIGNATURE ]; then
            cp SIGNATURE "$root/SIGNATURE"
          fi

      - name: Verify Linux package contents before ZIP
        shell: bash
        run: |
          set -euo pipefail

          root="dist/linux/app/SHEYTAN-Local-Agent"

          test -f "$root/SHEYTAN-Local-Agent"
          test -x "$root/SHEYTAN-Local-Agent"
          test -f "$root/README.txt"
          test -f "$root/BUILD-INFO.txt"
          test -f "$root/models/README.txt"
          test -f "$root/workspace/README.txt"

          if [ -f LICENSE ]; then
            test -f "$root/LICENSE"
          fi

          if [ -f README.md ]; then
            test -f "$root/README.md"
          fi

          if [ -f agent.md ]; then
            test -f "$root/AI-CONTEXT.md"
          fi

          if [ -f SIGNATURE ]; then
            test -f "$root/SIGNATURE"
          fi

          echo "Linux package content verification passed."

      - name: Create Linux ZIP
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist

          zip="dist/SHEYTAN-Local-Agent-Linux-x64-v${APP_VERSION}Z.zip"

          rm -f "$zip"

          (
            cd dist/linux/app
            zip -r -9 "../../../$zip" SHEYTAN-Local-Agent
          )

          test -f "$zip"
          test -s "$zip"

      - name: Verify Linux ZIP
        shell: bash
        run: |
          set -euo pipefail

          zip="dist/SHEYTAN-Local-Agent-Linux-x64-v${APP_VERSION}Z.zip"

          test -f "$zip"
          test -s "$zip"

          unzip -t "$zip" >/dev/null

          entries="$(unzip -Z1 "$zip")"

          grep -Fxq \
            "SHEYTAN-Local-Agent/SHEYTAN-Local-Agent" \
            <<< "$entries"

          grep -Fxq \
            "SHEYTAN-Local-Agent/README.txt" \
            <<< "$entries"

          grep -Fxq \
            "SHEYTAN-Local-Agent/BUILD-INFO.txt" \
            <<< "$entries"

          grep -Fxq \
            "SHEYTAN-Local-Agent/models/README.txt" \
            <<< "$entries"

          grep -Fxq \
            "SHEYTAN-Local-Agent/workspace/README.txt" \
            <<< "$entries"

          if [ -f LICENSE ]; then
            grep -Fxq \
              "SHEYTAN-Local-Agent/LICENSE" \
              <<< "$entries"
          fi

          if [ -f README.md ]; then
            grep -Fxq \
              "SHEYTAN-Local-Agent/README.md" \
              <<< "$entries"
          fi

          if [ -f agent.md ]; then
            grep -Fxq \
              "SHEYTAN-Local-Agent/AI-CONTEXT.md" \
              <<< "$entries"
          fi

          if [ -f SIGNATURE ]; then
            grep -Fxq \
              "SHEYTAN-Local-Agent/SIGNATURE" \
              <<< "$entries"
          fi

          echo "Linux ZIP integrity and content verification passed."

      - name: Upload Linux package
        uses: actions/upload-artifact@v6
        with:
          name: SHEYTAN-Local-Agent-Linux-x64-v${{ env.APP_VERSION }}Z
          path: dist/SHEYTAN-Local-Agent-Linux-x64-v${{ env.APP_VERSION }}Z.zip
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish and verify ${{ github.ref_name }}
    needs:
      - build-windows
      - build-linux
      - audit

    # v1.1.8: the release job consumes the audit job's runtime-resolved
    # identity (package.json) — it needs no checkout to verify the tag.
    env:
      APP_VERSION: ${{ needs.audit.outputs.version }}
      APP_VERSION_FULL: ${{ needs.audit.outputs.version_full }}
      APP_CODENAME: ${{ needs.audit.outputs.codename }}

    # v1.1.4Z: version-agnostic gate — the job runs for any v* tag and the
    # first step verifies the tag equals v${APP_VERSION}Z. The previous
    # hardcode silently skipped the release job on every version bump
    # until someone remembered to edit this file (the single most
    # dangerous trap in the old pipeline).
    if: startsWith(github.ref, 'refs/tags/v')

    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - name: Verify release tag
        shell: bash
        run: |
          set -euo pipefail

          test "${GITHUB_REF_NAME}" = "v${APP_VERSION}Z"

          echo "Release tag verified: ${GITHUB_REF_NAME}"

      - name: Download Windows package
        uses: actions/download-artifact@v7
        with:
          name: SHEYTAN-Local-Agent-Windows-x64-v${{ env.APP_VERSION }}Z
          path: dist/windows

      - name: Download Linux package
        uses: actions/download-artifact@v7
        with:
          name: SHEYTAN-Local-Agent-Linux-x64-v${{ env.APP_VERSION }}Z
          path: dist/linux

      - name: Verify release ZIP payloads
        shell: bash
        run: |
          set -euo pipefail

          windows_zip_name="SHEYTAN-Local-Agent-Windows-x64-v${APP_VERSION}Z.zip"
          linux_zip_name="SHEYTAN-Local-Agent-Linux-x64-v${APP_VERSION}Z.zip"

          windows="$(find dist/windows -type f -name "$windows_zip_name" -print -quit)"
          linux="$(find dist/linux -type f -name "$linux_zip_name" -print -quit)"

          test -n "$windows"
          test -n "$linux"

          test -f "$windows"
          test -f "$linux"

          test -s "$windows"
          test -s "$linux"

          echo "Found Windows ZIP: $windows"
          echo "Found Linux ZIP:   $linux"

          unzip -t "$windows" >/dev/null
          unzip -t "$linux" >/dev/null

          windows_entries="$(unzip -Z1 "$windows")"
          linux_entries="$(unzip -Z1 "$linux")"

          grep -Fxq \
            "SHEYTAN-Local-Agent/SHEYTAN-Local-Agent.exe" \
            <<< "$windows_entries"

          grep -Fxq \
            "SHEYTAN-Local-Agent/README.txt" \
            <<< "$windows_entries"

          grep -Fxq \
            "SHEYTAN-Local-Agent/BUILD-INFO.txt" \
            <<< "$windows_entries"

          grep -Fxq \
            "SHEYTAN-Local-Agent/models/README.txt" \
            <<< "$windows_entries"

          grep -Fxq \
            "SHEYTAN-Local-Agent/workspace/README.txt" \
            <<< "$windows_entries"

          grep -Fxq \
            "SHEYTAN-Local-Agent/SHEYTAN-Local-Agent" \
            <<< "$linux_entries"

          grep -Fxq \
            "SHEYTAN-Local-Agent/README.txt" \
            <<< "$linux_entries"

          grep -Fxq \
            "SHEYTAN-Local-Agent/BUILD-INFO.txt" \
            <<< "$linux_entries"

          grep -Fxq \
            "SHEYTAN-Local-Agent/models/README.txt" \
            <<< "$linux_entries"

          grep -Fxq \
            "SHEYTAN-Local-Agent/workspace/README.txt" \
            <<< "$linux_entries"

          if grep -Fxq \
            "SHEYTAN-Local-Agent/LICENSE" \
            <<< "$windows_entries"; then
            echo "Windows LICENSE present."
          fi

          if grep -Fxq \
            "SHEYTAN-Local-Agent/README.md" \
            <<< "$windows_entries"; then
            echo "Windows README.md present."
          fi

          if grep -Fxq \
            "SHEYTAN-Local-Agent/AI-CONTEXT.md" \
            <<< "$windows_entries"; then
            echo "Windows AI-CONTEXT.md present."
          fi

          if grep -Fxq \
            "SHEYTAN-Local-Agent/SIGNATURE" \
            <<< "$windows_entries"; then
            echo "Windows SIGNATURE present."
          fi

          if grep -Fxq \
            "SHEYTAN-Local-Agent/LICENSE" \
            <<< "$linux_entries"; then
            echo "Linux LICENSE present."
          fi

          if grep -Fxq \
            "SHEYTAN-Local-Agent/README.md" \
            <<< "$linux_entries"; then
            echo "Linux README.md present."
          fi

          if grep -Fxq \
            "SHEYTAN-Local-Agent/AI-CONTEXT.md" \
            <<< "$linux_entries"; then
            echo "Linux AI-CONTEXT.md present."
          fi

          if grep -Fxq \
            "SHEYTAN-Local-Agent/SIGNATURE" \
            <<< "$linux_entries"; then
            echo "Linux SIGNATURE present."
          fi

          echo "WINDOWS_ZIP=$windows" >> "$GITHUB_ENV"
          echo "LINUX_ZIP=$linux" >> "$GITHUB_ENV"

          echo "Release ZIP payload verification passed."

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: SHEYTAN-Local-Agent ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            ${{ env.WINDOWS_ZIP }}
            ${{ env.LINUX_ZIP }}

      - name: Verify published release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          payload="$(
            gh release view \
              "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --json tagName,isDraft,isPrerelease,assets
          )"

          echo "$payload"

          windows_asset="SHEYTAN-Local-Agent-Windows-x64-v${APP_VERSION}Z.zip"
          linux_asset="SHEYTAN-Local-Agent-Linux-x64-v${APP_VERSION}Z.zip"

          echo "$payload" |
            jq -e \
              --arg tag "${GITHUB_REF_NAME}" \
              --arg windows "$windows_asset" \
              --arg linux "$linux_asset" \
              '
                .tagName == $tag and
                .isDraft == false and
                .isPrerelease == false and
                ([.assets[].name] | index($windows)) != null and
                ([.assets[].name] | index($linux)) != null
              ' \
            >/dev/null

          echo "${GITHUB_REF_NAME} release asset verification passed."
