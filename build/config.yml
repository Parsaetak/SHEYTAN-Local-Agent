info:
  productName: "SHEYTAN-LA"
  productIdentifier: "com.parsaetak.sheytan-la"
  productVersion: "1.6.1"
  companyName: "Parsaetak"
  productDescription: "SHEYTAN Local Agent — native local AI agent runtime (SHEYTAN-LA)"

dev_mode:
  root_path: .

  log_level: warn

  debounce: 500

  ignore:
    dir:
      - .git
      - node_modules
      - dist
      - web/static
      - bin
      - tmp
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
    watched_extension:
      - "*.go"
      - "*.ts"
      - "*.tsx"
      - "*.css"
      - "*.html"
      - "*.json"
      - "*.yml"
      - "*.yaml"
    git_ignore: true

  executes:
    - cmd: wails3 task common:install:frontend:deps
      type: once

    - cmd: wails3 task common:dev:frontend
      type: background

    - cmd: go mod tidy
      type: blocking

    - cmd: wails3 task build
      type: blocking

    - cmd: wails3 task run
      type: primary
